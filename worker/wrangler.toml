name = "prijavimse-notifier"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
CATEGORY = "Master A"
RACES_URL = "https://raw.githubusercontent.com/Excalibrus/PrijavimSeNotifier/main/races.txt"

# Replace id with the one printed by:
#   npx wrangler kv namespace create STATE
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
