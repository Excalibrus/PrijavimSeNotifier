name = "prijavimse-notifier"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
CATEGORY = "Master A"
RACES_URL = "https://raw.githubusercontent.com/Excalibrus/PrijavimSeNotifier/main/races.txt"
# Repo whose "notify" workflow actually sends the push (see GH_TOKEN secret).
GH_REPO = "Excalibrus/PrijavimSeNotifier"

# Created with:
#   npx wrangler kv namespace create STATE
[[kv_namespaces]]
binding = "STATE"
id = "1f94c3d186264f618466f63222f4740a"
